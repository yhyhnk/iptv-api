<text x="860.0" y="838" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" text-anchor="middle">Pages 的下载按钮指向本次 Release</text>
<text x="40" y="875" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="start">结果不提交回 Git；该链路与桌面应用安装包发布、自动更新相互独立。</text>
