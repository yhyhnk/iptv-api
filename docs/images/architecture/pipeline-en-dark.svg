<rect x="500" y="590" width="200" height="110" rx="16" fill="#251e3b" stroke="#594381" stroke-width="1.5"/>
<text x="600.0" y="625" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#c4b5fd" text-anchor="middle">manual</text>
<text x="600.0" y="653" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1" text-anchor="middle">Collect candidates only</text>
