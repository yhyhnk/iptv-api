<rect x="270" y="590" width="200" height="110" rx="16" fill="#251e3b" stroke="#594381" stroke-width="1.5"/>
<text x="370.0" y="625" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#c4b5fd" text-anchor="middle">full</text>
<text x="370.0" y="653" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" text-anchor="middle">Test every candidate</text>
<text x="370.0" y="677" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1" text-anchor="middle">Filter by configured rules</text>
<path d="M 370 525 L 370 557 L 600 557 L 600 590" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
