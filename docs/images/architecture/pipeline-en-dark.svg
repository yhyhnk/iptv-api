<rect x="40" y="428" width="660" height="100" rx="16" fill="#000000" opacity="0.18"/>
<rect x="40" y="425" width="660" height="100" rx="16" fill="#251e3b" stroke="#594381" stroke-width="1.5"/>
<text x="370.0" y="460" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#c4b5fd" text-anchor="middle">03  Merge &amp; match channels</text>
