<text x="260.0" y="707" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">部署 GitHub Pages</text>
<rect x="640" y="623" width="440" height="100" rx="16" fill="#0f172a" opacity="0.035"/>
<rect x="640" y="620" width="440" height="100" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
