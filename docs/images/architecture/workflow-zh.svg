<text x="260.0" y="838" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">result.txt / result.m3u / epg.gz</text>
<rect x="640" y="778" width="440" height="75" rx="16" fill="#0f172a" opacity="0.035"/>
