<rect x="500" y="590" width="200" height="110" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="600.0" y="625" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#6d28d9" text-anchor="middle">manual</text>
<text x="600.0" y="653" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">Collect candidates only</text>
<text x="600.0" y="677" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Retest in the GUI</text>
