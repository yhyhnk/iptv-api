<text x="370.0" y="833" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">ResultAggregator → TXT / M3U / SQLite</text>
<text x="370.0" y="857" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Optional incremental writes; final flush on completion</text>
