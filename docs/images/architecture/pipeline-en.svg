<text x="930.0" y="460" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#b45309" text-anchor="middle">Write EPG separately</text>
<text x="930.0" y="488" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">epg.xml / epg.gz</text>
<text x="930.0" y="512" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Outside media speed testing</text>
<path d="M 370 375 L 370 425" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="40" y="428" width="660" height="100" rx="16" fill="#0f172a" opacity="0.035"/>
<rect x="40" y="425" width="660" height="100" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="370.0" y="460" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#6d28d9" text-anchor="middle">03  Merge &amp; match channels</text>
<text x="370.0" y="488" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Aggregate candidates by template, aliases, and rules</text>
<text x="370.0" y="512" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Optional unmatched category bypasses speed testing</text>
