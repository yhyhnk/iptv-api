<text x="930.0" y="805" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#047857" text-anchor="middle">Records &amp; cache</text>
<text x="930.0" y="833" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Logs / state / optional captures</text>
<text x="930.0" y="857" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Save cache when history is on</text>
<text x="40" y="905" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">Source EPG extraction fetches subscriptions first, then EPG; otherwise they can run concurrently.</text>
