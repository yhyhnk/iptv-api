<text x="930.0" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">open_update / update_startup</text>
<text x="930.0" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">GUI controls or local schedule</text>
