<rect x="270" y="590" width="200" height="110" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="370.0" y="625" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#6d28d9" text-anchor="middle">full</text>
<text x="370.0" y="653" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">Test every candidate</text>
<text x="370.0" y="677" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">Filter by configured rules</text>
<path d="M 370 525 L 370 557 L 600 557 L 600 590" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
