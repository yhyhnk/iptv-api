<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">How configuration shapes a run</title>
<desc id="desc">Configuration is merged by priority, then consumed by each stage; environment variables win</desc>
